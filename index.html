<head>

    <meta charset="UTF-8">

    <link rel="stylesheet" href="styleforthepomodoro.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

<body>

    <nav class="topnav">

        <a href="index.html">Pomodoro Timer</a>

    </nav>

    <h1>pomodorobypanini 🌱</h1>

    <div class="app-container">
        <div class="mode-switch">
            <button onclick="setMode('work')" id="workBtn">Study Time</button>
            <button onclick="setMode('short')" id="shortBtn">Short Break</button>
            <button onclick="setMode('long')" id="longBtn">Long Break</button>
        </div>

        <div class="timer-circle" id="timer">25:00</div>

        <div class="control-buttons">
            <button onclick="togglePauseResume()">Start</button>
            <button onclick="restartTimer()">Reset</button>
        </div>
    </div>

    <script src="index.js"></script>

    <footer>
