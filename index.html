<!DOCTYPE html>
<html lang="en">

<div class="topnav">
    <a href="#home">Homer</a>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css"
    <script src="https://kit.fontawesome.com/7ef4f43f2a.js" crossorigin="anonymous"></script>
</head>

<body>
    <h1>pomodorobypanini 🌱</h1>

    <div class="app-container">
        <div class="mode-switch">\
            <button onclick="setMode('work')" id="workBtn">Study Time</button>
            <button onclick="setMode('short')" id="shortBtn">Short Break</button>
            <button onclick="setMode('long')" id="longBtn">Long Break</button>
        </div>

        <div class="timer-circle" id="timer">25:00</div>

        <div class="control-buttons">
            <button onclick="togglePauseResume()">Start</button>
            <button onclick="restartTimer()">Reset</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
