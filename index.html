<!DOCTYPE html>

<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
            content="width=device-width, initial-scale = 1.0">
        <title>Pomodoro Timer</title>
        <link rel="stylesheet"
            href="style.css">
        <script src="https://kit.fontawesome.com/7ef4f43f2a.js" 
            crossorigin="anonymous">
        </script>
    </head>
    <body>
        <h1 style="color:rgb(140, 0, 190)">
            pomodorobypanini
        </h1>
        <div class="main">
            <div class="timer-circle"
                    id="timer">25:00
            </div>
        </div>
        <div class="control-buttons">
            <button onclick="togglePauseResume()">
                Pause
            </button>
            <button onclick="restartTimer()">
                Restart
            </button>
            <button onclick="chooseTime()">
                Choose Time
            </button>
        </div>
    </div>
        <script src="index.js"></script>
    </body>
</html>
