    <h1>Tasks 🌱</h1>

    <div class="app-container">
        <h2>Your Tasks</h2>

        <div class="task-input">
            <input 
                id="taskInput" 
                placeholder="Add a task... ✨"
                onkeypress="if(event.key==='Enter') addTask()"
            >
            <button onclick="addTask()">Add</button>
        </div>

        <ul id="taskList"></ul>
    </div>
